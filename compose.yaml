# Local development stack: API, worker, PostgreSQL, Redis and a mail catcher.
# Angular runs on the host with `npm start -w @shortlist/web` (http://localhost:4200).

name: shortlist

x-server: &server
  build:
    context: .
    dockerfile: deploy/server.Dockerfile
  image: shortlist-server:dev
  environment:
    NODE_ENV: development
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    SMTP_URL: smtp://mailpit:1025
    # Angular's dev server (host) proxies /api and /r to the API, so the browser origin is :4200.
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4200}
    RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?set RATE_LIMIT_SECRET in .env}
    EMAIL_OUTBOX_KEY: ${EMAIL_OUTBOX_KEY:?set EMAIL_OUTBOX_KEY in .env}
    MAIL_FROM: Shortlist (development) <no-reply@shortlist.local>
    # Optional JSON overriding default rate-limit policies.
    RATE_LIMIT_POLICIES: ${RATE_LIMIT_POLICIES:-}
    # Development stand-in for human verification. Production refuses to start with it.
    CHALLENGE_PROVIDER: dev
    LOG_LEVEL: ${LOG_LEVEL:-info}
  # Source is mounted read-only and `node --watch` restarts on edits.
  volumes:
    - ./apps/server/src:/app/apps/server/src:ro
    - ./packages/contracts/src:/app/packages/contracts/src:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_healthy
  restart: unless-stopped

services:
  # One-shot release step: applies pending migrations, then exits. The API and worker
  # start only after it succeeds. Each migration runs in its own transaction.
  migrate:
    image: shortlist-server:dev
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    command: ["npm", "run", "migrate", "--", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./database/migrations:/app/database/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Health check uses readiness: the container is healthy only while PostgreSQL is reachable.
  api:
    <<: *server
    command: ["node", "--watch", "src/api.js"]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  # No health check yet: the worker exposes no HTTP endpoint. Heartbeat arrives with T22.
  worker:
    <<: *server
    command: ["node", "--watch", "src/worker.js"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Append-only persistence; noeviction so sessions and pending click events are never
  # silently evicted (technical-design §7). Writes fail instead when memory is full.
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Development mail catcher only. It never delivers real email.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
